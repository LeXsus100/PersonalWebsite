  # ====================================== EDUCATION ====================================== #

  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: Master of Science · Materials Engineering & Nanotechnology
        school:
          name: Politecnico di Milano, Italy
          url: https://polimi.it
        date: Sep 2023 - Jul 2026
        final_grade: 100 out of 110
        content: |
          Specialisation in **Engineering Application**:  
          An application-oriented track focused on connecting materials science fundamentals with real engineering problems, from material selection and processing to performance, failure, surface engineering, energy applications, and sustainability.

          The programme covered **metals**, **polymers**, **composites**, and **advanced materials**, combining their mechanical and chemical behaviour with characterisation methods, manufacturing considerations, corrosion, product development, and life-cycle assessment.

          A selection of **lecture notes** from the programme is available <a href="/library/latex-notes/">here</a>.

          🎓 **Master's Thesis ➝ Solid-State Aluminium Recycling**  
          Experimental investigation of **solid-state aluminium recycling** via roll bonding, analysing the influence of process parameters on microstructure, mechanical properties, and hardness to assess feasibility and material behaviour.


        featuredLink:
          enable: true
          name: Master Thesis (Public version)
          url: pdf/PoliMi_Luigi-Master_Thesis.pdf

      - title: Exchange Student · Materials Engineering
        school:
          name: Shanghai Jiao Tong University, China
          url: https://en.sjtu.edu.cn
        date: Sep 2024 - Feb 2025
        GPA: 3.8 out of 4.0
        content: |
          **"World Wide Exchange Program"** offered by *Politecnico di Milano*.
          
          It focused on **project-based learning and practical application of materials science concepts**, with work spanning multiscale modelling, bio-functional and smart polymeric materials, thermodynamics, and advanced characterisation techniques.

          A selection of **projects** completed during the exchange is available <a href="/library/sjtu-coursework/">here</a>.

          
      - title: "Bachelor of Science · Materials Engineering & Nanotechnology"
        school:
          name: Politecnico di Milano, Italy
          url: https://polimi.it
        date: Sep 2020 - Jul 2023
        final_grade: 93 out of 110
        content: |
          The programme built a broad foundation in materials science and engineering, covering the **behaviour**, **processing**, and **characterisation** of **metals**, **polymers**, and **ceramics**, together with mechanics, corrosion, experimental methods, and CAD.

          🧪 **Bachelor's Thesis ➝ Printed Device for Energy Storage (Group Project)**  
          Development and characterisation of a printed energy-storage device, focusing on **gel-based electrolytes** to optimise energy density, ionic conductivity, and mechanical resistance for improved overall performance.


        featuredLink:
          enable: true
          name: Bachelor Thesis
          url: pdf/PoliMi_Luigi-Bachelor_Thesis.pdf

      - title: Exchange Student · STEM subjects
        school:
          name: Kawana Waters State College, Australia
          url: https://kawanawaterssc.eq.edu.au
        date: Jun 2016 - Sep 2016
        content: |-
          One academic term abroad, fully immersed in the **local school environment and culture** through regular classes alongside local students and a host-family stay.


