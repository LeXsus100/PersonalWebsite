    items:
      - company: EssilorLuxottica
        companyUrl: https://www.essilorluxottica.com/
        jobs:
          - name: Raw Production Engineer # Job Title
            date: April 2026 - Current
            info:
              content: Internship # Synthetic explanation
            content: |
              I work at the intersection of production engineering, data analysis and software development.

              My main project is the development of an **APS-oriented software platform** for production scheduling and operational monitoring. The system:

              * integrates MES and SQL production data
              * recommends lot allocation and sequencing based on machine availability, due dates, production and quality constraints, and changeover minimisation
              * provides real-time KPI monitoring, historical trend analysis and comparison against departmental targets
              * supports the standardisation and digitalisation of departmental planning processes

              Alongside the project, I analyse **production data** related to performance, quality, cycle times, scrap and many others, supporting root-cause analysis, **Lean Manufacturing** and continuous improvement initiatives.

            featuredItems:
              fontAwesomeIcons:
                - icon: fas fa-location-dot
                  tooltip: Sedico (BL), Italy

