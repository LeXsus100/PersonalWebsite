  # ====================================== EXPERIENCE ====================================== #

  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: EssilorLuxottica
        companyUrl: https://www.essilorluxottica.com/
        jobs:
          - name: Production Planning Engineer # Job Title
            date: April 2026 - Current
            info:
              content: Internship # Synthetic explanation
            content: |
              I work across **production planning**, **manufacturing engineering**, **data analysis** and **digital OT**, with a focus on analysing, digitalising and standardising production operations, projects and reporting.

              As part of a broader effort to **digitalise production operations**, I design and develop **end-to-end software applications**, covering data architecture, databases, backend logic, system integration, user interfaces and deployment. My work includes:

              * turning operational processes into structured software solutions, replacing manual and fragmented workflows
              * integrating MES, SQL and production data to support planning, traceability, reporting and decision-making
              * building planning and performance tools for sequencing, capacity management, KPIs and operational analysis

              Alongside software development, I work directly on **production planning and manufacturing performance**, managing priorities, lot allocation, sequencing and capacity while analysing **OEE**, **scrap**, **cycle times**, **quality** and **production losses** to support root-cause analysis, **Lean Manufacturing** and continuous improvement.

            featuredItems:
              fontAwesomeIcons:
                - icon: fas fa-location-dot
                  tooltip: Sedico (BL), Italy

      - company: Aquatic Facilities
        companyUrl: https://www.quantaclub.com/
