  # ====================================== ABOUT ====================================== #
  about:
    enable: true
    title: "About"
    # image: "/images/me.png"
    content: |
      I hold a **Master’s degree** in **Materials Engineering and Nanotechnology**, but my interests have never stayed within one field.

      I spent many years in **competitive swimming** and studying **piano**, and along the way I’ve worked as a lifeguard, tutored, and taken part in academic competitions.  
      I’ve lived and studied abroad in **China** and **Australia**, with shorter periods in the UK, US, and France. I enjoy being somewhere unfamiliar and seeing how differently people live and think.

      These days, a lot of my free time goes into **building and tinkering** with things: running a Debian home server, developing React websites, writing documentation in LaTeX, building Python software, and pretty much anything else that gives me an excuse to dig into how things work under the hood.

      That curiosity extends well beyond technology. I spend a lot of time reading about **finance**, **geopolitics**, **strategy games**, and generally disappearing down whatever **rabbit hole** happens to catch my attention.

